[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Cache built assets (hashed filenames) for a long time, media for a week.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Old GoDaddy parking page sent browsers to /lander; send them home instead.
[[redirects]]
  from = "/lander"
  to = "/"
  status = 301
  force = true
